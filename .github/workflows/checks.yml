name: Vérifications et déploiement Brain

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Tests et syntaxe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer les dépendances API
        run: python -m pip install -r backend/requirements.txt httpx
      - name: Tests API
        run: python tests/test_api.py
      - name: Syntaxe JavaScript
        run: |
          node --check app.js
          node --check config.js

  deploy:
    name: Publication GitHub Pages
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Préparer uniquement les fichiers publics
        run: |
          mkdir -p _site
          cp index.html styles.css app.js config.js favicon.svg .nojekyll _site/
          test -s _site/index.html
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Préparer l'archive Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Déployer le site
        id: deployment
        uses: actions/deploy-pages@v4

  deploy_api:
    name: Déployer API Brain sur VPS
    needs: checks
    if: github.event_name != 'pull_request' && vars.BRAIN_VPS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: brain-vps-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Connexion SSH restreinte et déploiement validé
        shell: bash
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT }}
          SSH_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          SSH_KEY_B64: ${{ secrets.VPS_DEPLOY_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS || vars.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          [[ -n "$VPS_HOST" && ( -n "$SSH_KEY" || -n "$SSH_KEY_B64" ) && -n "$KNOWN_HOSTS" ]] || { echo "Paramètres VPS manquants."; exit 1; }
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "Hostname VPS invalide."; exit 1; }
          VPS_SSH_PORT="${VPS_SSH_PORT:-22}"
          [[ "$VPS_SSH_PORT" =~ ^[0-9]{1,5}$ ]] && (( VPS_SSH_PORT >= 1 && VPS_SSH_PORT <= 65535 )) || { echo "Port SSH invalide."; exit 1; }
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          if [[ -n "$SSH_KEY_B64" ]]; then
            printf '%s' "$SSH_KEY_B64" | base64 --decode > "$HOME/.ssh/brain_deploy"
          else
            printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/brain_deploy"
          fi
          chmod 600 "$HOME/.ssh/brain_deploy"
          ssh-keygen -y -f "$HOME/.ssh/brain_deploy" >/dev/null || {
            echo "::error::Clé SSH invalide : vérifier le secret VPS_DEPLOY_SSH_KEY_B64 (base64 sur une ligne)."
            exit 1
          }
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/brain_deploy" -p "$VPS_SSH_PORT" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=20 \
            "brain-deploy@$VPS_HOST" "deploy-brain $GITHUB_SHA"

