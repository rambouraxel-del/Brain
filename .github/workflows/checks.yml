name: Vérifications Brain

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer les dépendances API
        run: python -m pip install -r backend/requirements.txt httpx
      - name: Tests API
        run: python tests/test_api.py
      - name: Syntaxe JavaScript
        run: |
          node --check app.js
          node --check config.js
