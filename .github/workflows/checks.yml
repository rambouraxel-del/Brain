name: Vérifications et déploiement Brain

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Tests et syntaxe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer les dépendances API
        run: python -m pip install -r backend/requirements.txt httpx
      - name: Tests API
        run: python tests/test_api.py
      - name: Syntaxe JavaScript
        run: |
          node --check app.js
          node --check config.js
          node --check visual-themes.js
          node --check v2-workspace.js
          node tests/test_frontend_v2.cjs
      - name: Test de parcours frontend (DOM simulé)
        run: |
          npm install --no-save --ignore-scripts jsdom@26.1.0
          node tests/test_frontend_runtime.cjs

      - name: Vérifier l'image Docker avec l'utilisateur non privilégié
        run: |
          set -Eeuo pipefail
          # Reproduce the source permission inherited from VPS's umask 077.
          chmod 600 backend/main.py
          docker build -t brain-api-ci -f backend/Dockerfile backend
          docker run --rm --read-only --tmpfs /data:rw,uid=10001,gid=10001,mode=0700 \
            -e BRAIN_PASSWORD=ci_test_password_only_not_for_production \
            -e BRAIN_SIGNING_KEY=ci_test_signing_key_only_not_for_production_12345678 \
            -e BRAIN_ALLOWED_ORIGINS=https://example.com \
            brain-api-ci python -c 'import main; assert main.health() == {"ok": True}; print("Brain container health OK")'

  deploy:
    name: Publication GitHub Pages
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Préparer uniquement les fichiers publics
        run: |
          mkdir -p _site
          cp index.html styles.css app.js config.js favicon.svg .nojekyll _site/
          test -s _site/index.html
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Préparer l'archive Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Déployer le site
        id: deployment
        uses: actions/deploy-pages@v4

  changes:
    name: Détecter les modifications du backend
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'tests/test_api.py'
              - 'docker-compose.yml'
              - '.github/workflows/checks.yml'
              - 'ops/vps-bootstrap/**'

  deploy_api:
    name: Déployer API Brain sur VPS
    needs: [checks, changes]
    if: github.event_name != 'pull_request' && vars.BRAIN_VPS_DEPLOY_ENABLED == 'true' && (needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: brain-vps-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Connexion SSH restreinte et déploiement validé
        shell: bash
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT }}
          SSH_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          SSH_KEY_B64: ${{ secrets.VPS_DEPLOY_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS || vars.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          [[ -n "$VPS_HOST" && ( -n "$SSH_KEY" || -n "$SSH_KEY_B64" ) && -n "$KNOWN_HOSTS" ]] || { echo "Paramètres VPS manquants."; exit 1; }
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "Hostname VPS invalide."; exit 1; }
          VPS_SSH_PORT="${VPS_SSH_PORT:-22}"
          [[ "$VPS_SSH_PORT" =~ ^[0-9]{1,5}$ ]] && (( VPS_SSH_PORT >= 1 && VPS_SSH_PORT <= 65535 )) || { echo "Port SSH invalide."; exit 1; }
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          if [[ -n "$SSH_KEY_B64" ]]; then
            printf '%s' "$SSH_KEY_B64" | base64 --decode > "$HOME/.ssh/brain_deploy"
          else
            printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/brain_deploy"
          fi
          chmod 600 "$HOME/.ssh/brain_deploy"
          ssh-keygen -y -f "$HOME/.ssh/brain_deploy" >/dev/null || {
            echo "::error::Clé SSH invalide : vérifier le secret VPS_DEPLOY_SSH_KEY_B64 (base64 sur une ligne)."
            exit 1
          }
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/brain_deploy" -p "$VPS_SSH_PORT" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=20 \
            "brain-deploy@$VPS_HOST" "deploy-brain $GITHUB_SHA"


  verify_live:
    name: Vérifier Brain en HTTPS après publication
    needs: [deploy, deploy_api]
    if: github.event_name != 'pull_request' && vars.BRAIN_VPS_DEPLOY_ENABLED == 'true' && (needs.deploy_api.result == 'success' || needs.deploy_api.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tester API HTTPS, authentification et CORS
        shell: bash
        run: |
          set -Eeuo pipefail
          API=https://brain-api-57-129-178-40.sslip.io
          ORIGIN=https://rambouraxel-del.github.io
          curl --fail --silent --show-error --retry 4 --retry-delay 3 --max-time 15 "$API/api/health" |
            python3 -c 'import json,sys; assert json.load(sys.stdin)=={"ok":True}; print("API HTTPS OK")'
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 "$API/api/notes")"
          [[ "$code" == "401" ]] || { echo "::error::Notes non protégées (HTTP $code)"; exit 1; }
          echo "Accès non authentifié refusé (401) OK"
          headers="$(mktemp)"
          code="$(curl -sS -o /dev/null -D "$headers" -w '%{http_code}' --max-time 15 \
            -X OPTIONS "$API/api/notes" -H "Origin: $ORIGIN" \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization, content-type')"
          [[ "$code" == "200" ]] || { echo "::error::Prévol CORS échoué (HTTP $code)"; exit 1; }
          grep -iqF "access-control-allow-origin: $ORIGIN" "$headers" || {
            echo "::error::Origine GitHub Pages non autorisée"; exit 1;
          }
          echo "CORS navigateur OK"
      - name: Vérifier la configuration publiée sur GitHub Pages
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 4 --retry-delay 3 --max-time 15 \
            'https://rambouraxel-del.github.io/Brain/config.js' \
            | grep -Fq "apiBase: 'https://brain-api-57-129-178-40.sslip.io'" || {
              echo "::error::Frontend non relié au VPS"; exit 1;
            }
          echo "Frontend public relié au VPS OK"
